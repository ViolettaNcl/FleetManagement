name: CodeQL
on:
  push:
    branches: [master, 'feature/**', 'preview/fleetops-v3']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: |
          dotnet build src/FleetManagement.Api -c Release --no-incremental
          dotnet build src/FleetManagement.Web -c Release --no-incremental
      - uses: github/codeql-action/analyze@v3
        with:
          output: ${{ runner.temp }}/fleet-codeql-results
          upload: always
          wait-for-processing: true
      - name: Validate CodeQL SARIF (zero findings)
        run: |
          python3 tools/test_release_security.py
          python3 tools/check_codeql_sarif.py "$RUNNER_TEMP/fleet-codeql-results/csharp.sarif"
