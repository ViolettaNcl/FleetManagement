name: CodeQL
on:
  push:
    branches: [master, 'feature/**', 'preview/fleetops-v3']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: |
          dotnet build src/FleetManagement.Api -c Release --no-incremental
          dotnet build src/FleetManagement.Web -c Release --no-incremental
      - uses: github/codeql-action/analyze@v3
