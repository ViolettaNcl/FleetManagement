name: Browser demo CI
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run business rule regression checks
        run: dotnet run --project tests/FleetManagement.Core.Checks -c Release
      - name: Publish browser demo
        run: dotnet publish src/FleetManagement.Web -c Release -o publish
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-browser-demo
          path: publish/wwwroot
          if-no-files-found: error
      - name: Install browser test dependencies
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Browser smoke test at GitHub Pages subpath
        run: |
          mkdir -p preview/FleetManagement
          cp -a publish/wwwroot/. preview/FleetManagement/
          python3 -m http.server 8080 --bind 127.0.0.1 --directory preview &
          server=$!
          trap 'kill "$server" || true' EXIT
          node tests/browser/smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-browser-screenshots
          path: browser-results
          if-no-files-found: ignore
