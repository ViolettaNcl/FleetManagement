name: Browser demo CI
on:
  push:
    branches: [master, 'feature/**', 'preview/fleetops-v3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run business rule regression checks
        run: dotnet run --project tests/FleetManagement.Core.Checks -c Release
      - name: Publish browser demo
        run: dotnet publish src/FleetManagement.Web -c Release -o publish
      - name: Test and import verified owner artwork
        run: |
          python3 tests/browser/test_asset_import.py
          python3 tools/import_neon_assets.py publish/wwwroot
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-browser-demo
          path: publish/wwwroot
          if-no-files-found: error
      - name: Install browser test dependencies
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium firefox webkit
      - name: Install and verify video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Browser smoke test at GitHub Pages subpath
        run: |
          mkdir -p preview/FleetManagement
          cp -a publish/wwwroot/. preview/FleetManagement/
          python3 -m http.server 8080 --bind 127.0.0.1 --directory preview &
          server=$!
          trap 'kill "$server" || true' EXIT
          node tests/browser/v4.mjs
          node tests/browser/neon.mjs
          node tests/browser/smoke.mjs
          node tests/browser/cross-browser.mjs
          node tests/browser/portfolio-tour.mjs
          ffmpeg -hide_banner -loglevel error -y -i portfolio-video/fleetmanagement-v3-tour.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart portfolio-video/fleetmanagement-v3-tour.mp4
          python3 tests/browser/verify_media.py
          python3 tools/write_preview_manifest.py publish/wwwroot
          rm -rf preview/FleetManagement
          python3 tools/build_public_site.py publish/wwwroot preview/FleetManagement
          FLEET_PREVIEW_URL=http://127.0.0.1:8080/FleetManagement/ node tests/browser/seo-pwa.mjs
          node tests/browser/v4-audit.mjs
          # Local lab audit, not field Core Web Vitals. Pinned CLI used only in CI.
          CHROME_PATH="$(node --input-type=module -e 'import {chromium} from "./tests/browser/node_modules/playwright/index.mjs";console.log(chromium.executablePath())')" npx --yes lighthouse@13.6.0 http://127.0.0.1:8080/FleetManagement/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=browser-results/lighthouse-public.json --only-categories=performance,accessibility,best-practices,seo --quiet
      - name: Upload packaged V4 website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-v4-public-site
          path: preview/FleetManagement
          if-no-files-found: warn
      - name: Upload actual portfolio tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-portfolio-tour
          path: portfolio-video
          if-no-files-found: warn
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-browser-screenshots
          path: browser-results
          if-no-files-found: ignore
