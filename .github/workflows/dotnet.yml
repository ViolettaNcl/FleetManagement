name: .NET Build, Test, and Docs

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  .NET:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore FleetManagment/FleetManagement.sln

    - name: Build
      run: dotnet build FleetManagment/FleetManagement.sln --no-restore --configuration Release

    - name: Test with coverage
      run: |
        dotnet test FleetManagment/FleetManagement.sln --no-build --verbosity normal \
        --collect:"XPlat Code Coverage" \
        --settings coverlet.runsettings
      env:
        COVERLET_OUTPUT: TestResults/

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.3.7
      with:
        reports: 'TestResults/*/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'HtmlInline_AzurePipelines;Cobertura'
        title: 'FleetManagement Code Coverage'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coveragereport

    - name: Setup Node.js for DocFX
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install DocFX
      run: npm install -g docfx

    - name: Generate documentation
      run: docfx FleetManagment/Документы/docfx.json

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: FleetManagment/Документы/_site

    - name: Setup Java for PlantUML
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install PlantUML
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
        wget -O plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
        echo "PLANTUML_JAR=plantuml.jar" >> $GITHUB_ENV

    - name: Validate PlantUML diagrams
      run: |
        for file in FleetManagment/Документы/*.plantuml; do
          echo "Checking $file"
          java -jar $PLANTUML_JAR -checkonly "$file"
        done
