name: ML training and model registry
on:
  push:
    branches: [master, 'feature/**']
    paths: ['tools/FleetManagement.ModelTrainer/**', 'src/FleetManagement.Core/**', '.github/workflows/ml-ci.yml', 'tests/ml/**']
  pull_request:
    paths: ['tools/FleetManagement.ModelTrainer/**', 'src/FleetManagement.Core/**', '.github/workflows/ml-ci.yml', 'tests/ml/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Train and reload ML.NET models
        run: dotnet run --project tools/FleetManagement.ModelTrainer -c Release -- model-registry 42
      - name: Verify registry artifacts and metrics
        run: python3 tests/ml/verify_registry.py model-registry
      - name: Upload model registry
        uses: actions/upload-artifact@v4
        with:
          name: fleetmanagement-ml-registry
          path: model-registry
          if-no-files-found: error
