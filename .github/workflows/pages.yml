name: Publish FleetManagement demo
on:
  push:
    branches: [master]
    paths:
      - 'src/FleetManagement.Core/**'
      - 'src/FleetManagement.Web/**'
      - 'tests/FleetManagement.Core.Checks/**'
      - 'tests/browser/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/FleetManagement.Core.Checks -c Release
      - run: dotnet publish src/FleetManagement.Web -c Release -o publish
      - name: Validate published browser build
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          (cd tests/browser && npx playwright install --with-deps chromium)
          mkdir -p preview/FleetManagement
          cp -a publish/wwwroot/. preview/FleetManagement/
          python3 -m http.server 8080 --bind 127.0.0.1 --directory preview &
          server=$!
          trap 'kill "$server" || true' EXIT
          node tests/browser/smoke.mjs
      - run: touch publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
