name: Release evidence gate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  security-events: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test release evidence policy
        run: python3 tools/test_release_security.py
      - name: Check exact-commit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_gate.py "$RUNNER_TEMP/release-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
