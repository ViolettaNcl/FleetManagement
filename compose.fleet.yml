services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}"
    volumes:
      - fleet-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  api:
    build:
      context: .
      dockerfile: src/FleetManagement.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Fleet__ApiKey: "${FLEET_API_KEY:?Set FLEET_API_KEY}"
      Fleet__Provider: SqlServer
      Fleet__InitializeDatabase: "true"
      Fleet__SeedDemo: "true"
      ConnectionStrings__Fleet: "Server=db;Database=FleetPortfolio;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "127.0.0.1:5095:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  fleet-sql:
